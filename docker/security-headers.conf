# Guvenlik basliklari.
#
# NEDEN AYRI DOSYA: nginx'te add_header kalitimi degistirmez, EZER. Bir location
# blogunda tek bir add_header varsa, server seviyesindeki TUM add_header
# direktifleri o blok icin gecersiz olur. Bu yuzden onbellek basligi tasiyan her
# location bu dosyayi ayrica include etmek zorundadir.
#
# `always`: bu basliklar hata yanitlarinda (404, 500) da gonderilsin.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
