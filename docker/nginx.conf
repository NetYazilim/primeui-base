server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ---- sıkıştırma -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # ---- sağlık kontrolü (Dockerfile HEALTHCHECK bunu kullanır) ----------
    location = /healthz {
        access_log   off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # ---- hash'li varlıklar: sonsuza kadar önbelleklenebilir --------------
    # Vite bu dosyalara içerik hash'i basar (index-DQg1e_k1.js), içerik
    # değişince dosya adı da değişir.
    #
    # DİKKAT: Cache-Control'de `always` YOK. Olsaydı 404 yanıtları da bir yıllık
    # immutable başlık alırdı; tarayıcı/CDN olmayan bir dosyayı bir yıl
    # "yok" olarak önbelleğe alırdı.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- hash'siz statik dosyalar: kısa önbellek --------------------------
    # public/ altındaki dosyalar (favicon, apple-touch-icon) hash almaz;
    # immutable verilirse ikon değiştirdiğinizde kullanıcılar eskisini görür.
    location ~* \.(ico|svg|png|webmanifest|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- SPA fallback ----------------------------------------------------
    # index.html ASLA önbelleklenmemeli: içinde hash'li varlık adları var.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
